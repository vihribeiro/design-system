<div class="app" [class.app--open]="menuOpen()">
  <header class="topbar">
    <button type="button" class="menu-btn" aria-label="Abrir menu" (click)="toggleMenu()">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 12h18M3 6h18M3 18h18" />
      </svg>
    </button>

    <a class="brand" routerLink="/">&#64;vihribeiro/ui</a>
    <span class="version">v0.1.0</span>

    <div class="topbar__right">
      <a
        class="ghost-btn"
        href="https://github.com/vihribeiro/design-system"
        target="_blank"
        rel="noopener noreferrer"
      >
        GitHub
      </a>
      <button type="button" class="ghost-btn" (click)="theme.toggle()">
        @if (theme.theme() === 'dark') {
          Tema claro
        } @else {
          Tema escuro
        }
      </button>
    </div>
  </header>

  <div class="body">
    <aside class="sidenav">
      <nav class="nav">
        @for (group of nav; track group.title) {
          <div class="nav__group">
            <span class="nav__group-title">{{ group.title }}</span>
            @for (item of group.items; track item.route) {
              <a
                class="nav__link"
                [routerLink]="item.route"
                routerLinkActive="is-active"
                [routerLinkActiveOptions]="{ exact: item.route === '/' }"
                (click)="closeMenu()"
              >
                {{ item.label }}
              </a>
            }
          </div>
        }
      </nav>
      <div class="sidenav__footer">Angular 22 · Standalone</div>
    </aside>

    <div class="backdrop" (click)="closeMenu()"></div>

    <main class="content">
      <router-outlet />
    </main>

    <aside class="toc">
      @if (toc.sections().length) {
        <span class="toc__title">Nesta página</span>
        @for (item of toc.sections(); track item.id) {
          <a [href]="'#' + item.id">{{ item.title }}</a>
        }
      }
    </aside>
  </div>
</div>
