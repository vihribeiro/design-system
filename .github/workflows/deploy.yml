name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (biblioteca)
        run: npx ng test ui --watch=false

      - name: Unit tests (showcase)
        run: npx ng test showcase --watch=false

      - name: Build do showcase (base href para o repositório)
        run: npm run build -- --base-href=/${{ github.event.repository.name }}/

      - name: SPA fallback (404.html)
        run: cp dist/showcase/browser/index.html dist/showcase/browser/404.html

      - name: Add .nojekyll
        run: touch dist/showcase/browser/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/showcase/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
